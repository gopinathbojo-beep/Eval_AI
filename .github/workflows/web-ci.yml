name: Web deployment checks

on:
  push:
    paths: ["frontend/**", "backend/**", "deploy/**", "compose.yaml", "render.yaml", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", "deploy/**", "compose.yaml", "render.yaml", ".github/workflows/web-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install API dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --require-hashes -r backend/requirements.lock
      - name: Test API
        working-directory: backend
        run: .venv/bin/python -m pytest -q
      - name: Audit API dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.lock --disable-pip --no-deps
      - name: Install and test web
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Build production containers
        run: |
          docker compose config --quiet
          docker compose build
          docker run --rm -e DOMAIN=eval.example.test -e ACME_EMAIL=admin@example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        env:
          DOMAIN: eval.example.test
          ACME_EMAIL: admin@example.test
          SECRET_KEY: ci-config-validation-secret-not-a-deployment-key
      - name: Check container health and reverse proxy
        run: |
          docker compose up -d backend web
          for attempt in $(seq 1 30); do
            if docker compose exec -T web wget -q -O /dev/null http://127.0.0.1:8080/api/ready; then break; fi
            sleep 2
          done
          docker compose exec -T web nginx -t
          docker compose exec -T web wget -q -O /dev/null http://127.0.0.1:8080/api/ready
          docker compose exec -T web wget -q -O /dev/null http://127.0.0.1:8080/exams/example/content
        env:
          DOMAIN: eval.example.test
          ACME_EMAIL: admin@example.test
          SECRET_KEY: ci-config-validation-secret-not-a-deployment-key
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs --tail=100
          docker compose down
        env:
          DOMAIN: eval.example.test
          ACME_EMAIL: admin@example.test
          SECRET_KEY: ci-config-validation-secret-not-a-deployment-key
