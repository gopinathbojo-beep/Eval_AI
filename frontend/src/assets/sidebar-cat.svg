<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 210" fill="none">
  <defs>
    <linearGradient id="bookLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bookTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#f5e6c4"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#020617" stop-opacity=".45"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft floor shadow -->
  <ellipse cx="135" cy="196" rx="125" ry="12" fill="url(#floorShadow)"/>

  <!-- plant -->
  <g>
    <path d="M30 150 C 28 120, 22 100, 14 82" stroke="#166534" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M32 150 C 34 118, 42 98, 54 84" stroke="#166534" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M31 150 C 31 126, 30 106, 32 88" stroke="#166534" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="12" cy="80" rx="13" ry="7" transform="rotate(-35 12 80)" fill="url(#leaf)"/>
    <ellipse cx="20" cy="104" rx="12" ry="6.5" transform="rotate(-20 20 104)" fill="url(#leaf)"/>
    <ellipse cx="56" cy="82" rx="13" ry="7" transform="rotate(30 56 82)" fill="url(#leaf)"/>
    <ellipse cx="46" cy="106" rx="12" ry="6.5" transform="rotate(25 46 106)" fill="url(#leaf)"/>
    <ellipse cx="32" cy="84" rx="7" ry="12" fill="url(#leaf)"/>
    <ellipse cx="22" cy="126" rx="10" ry="5.5" transform="rotate(-15 22 126)" fill="url(#leaf)"/>
    <ellipse cx="42" cy="126" rx="10" ry="5.5" transform="rotate(15 42 126)" fill="url(#leaf)"/>
    <!-- pot -->
    <path d="M8 146 H 56 L 51 190 Q 50 194 46 194 H 18 Q 14 194 13 190 Z" fill="url(#pot)"/>
    <ellipse cx="32" cy="146" rx="24" ry="5" fill="#f8fafc"/>
    <ellipse cx="32" cy="146" rx="19" ry="3" fill="#57534e"/>
  </g>

  <!-- bottom book -->
  <g>
    <rect x="44" y="154" width="190" height="38" rx="5" fill="url(#bookLow)"/>
    <rect x="44" y="154" width="190" height="5" rx="2.5" fill="#60a5fa"/>
    <rect x="154" y="159" width="76" height="28" rx="2" fill="url(#pages)"/>
    <path d="M156 166 H 228 M156 173 H 228 M156 180 H 228" stroke="#e7d5a8" stroke-width="1"/>
    <path d="M62 158 V 190 M70 158 V 190" stroke="#f59e0b" stroke-width="2.2"/>
    <path d="M86 172 H 130" stroke="#93c5fd" stroke-opacity=".6" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- top book -->
  <g>
    <rect x="58" y="120" width="176" height="36" rx="5" fill="url(#bookTop)"/>
    <rect x="58" y="120" width="176" height="5" rx="2.5" fill="#7dd3fc"/>
    <rect x="160" y="125" width="70" height="26" rx="2" fill="url(#pages)"/>
    <path d="M162 132 H 228 M162 139 H 228 M162 146 H 228" stroke="#e7d5a8" stroke-width="1"/>
    <path d="M76 124 V 156 M84 124 V 156" stroke="#f59e0b" stroke-width="2.2"/>
    <!-- bookmark ribbon -->
    <path d="M208 151 V 170 L 212 165 L 216 170 V 151 Z" fill="#f59e0b"/>
  </g>

  <!-- cat -->
  <g stroke="#94a3b8" stroke-width=".8" stroke-linejoin="round">
    <!-- tail draped over the book -->
    <path d="M86 112 C 66 114, 60 128, 70 142 C 74 148, 82 146, 80 140 C 74 130, 78 122, 92 120 Z" fill="#6b7280"/>
    <path d="M70 128 L 78 126 M70 136 L 77 135" stroke="#4b5563" stroke-width="2.4" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="134" cy="100" rx="58" ry="24" fill="url(#fur)"/>
    <!-- calico patches -->
    <path d="M86 92 C 92 76, 116 72, 128 80 C 122 90, 104 96, 88 102 Z" fill="#6b7280" stroke="none"/>
    <path d="M128 78 C 140 74, 152 76, 158 82 C 150 88, 138 88, 128 84 Z" fill="#f59e0b" stroke="none" opacity=".9"/>
    <path d="M100 116 C 108 112, 118 114, 122 120 C 112 123, 104 122, 100 116 Z" fill="#9ca3af" stroke="none"/>

    <!-- back paw -->
    <ellipse cx="104" cy="121" rx="11" ry="5.5" fill="#ffffff"/>

    <!-- head -->
    <path d="M164 72 L 168 46 L 184 62 Z" fill="#6b7280"/>
    <path d="M168 56 L 170 50 L 178 60 Z" fill="#fda4af" stroke="none"/>
    <path d="M196 62 L 212 46 L 214 72 Z" fill="#ffffff"/>
    <path d="M202 60 L 210 52 L 211 64 Z" fill="#fda4af" stroke="none"/>
    <ellipse cx="189" cy="86" rx="29" ry="25" fill="url(#fur)"/>
    <path d="M162 80 C 164 64, 180 60, 188 64 C 186 74, 176 80, 162 86 Z" fill="#6b7280" stroke="none"/>

    <!-- face -->
    <g stroke="#334155" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M172 88 Q 177 92 182 88"/>
      <path d="M196 88 Q 201 92 206 88"/>
      <path d="M185 100 Q 189 103 189 100 Q 189 103 193 100" stroke-width="1.3"/>
    </g>
    <path d="M186 95 H 192 L 189 98.5 Z" fill="#fb7185" stroke="none"/>
    <ellipse cx="173" cy="97" rx="5" ry="2.8" fill="#fda4af" stroke="none" opacity=".75"/>
    <ellipse cx="205" cy="97" rx="5" ry="2.8" fill="#fda4af" stroke="none" opacity=".75"/>
    <g stroke="#cbd5e1" stroke-width="1" stroke-linecap="round">
      <path d="M210 94 L 226 90 M210 98 L 227 99 M210 102 L 224 107"/>
      <path d="M168 94 L 154 91 M168 98 L 153 99"/>
    </g>

    <!-- front paws over the book edge -->
    <ellipse cx="174" cy="119" rx="10" ry="6" fill="#ffffff"/>
    <ellipse cx="196" cy="119" rx="10" ry="6" fill="#ffffff"/>
    <path d="M170 121 V 124 M174 122 V 125 M192 121 V 124 M196 122 V 125" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
